<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ restaurant }} - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-900 to-gray-900 h-screen flex items-center justify-center font-sans">
    <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full text-center">
        <h1 class="text-3xl font-extrabold text-gray-800 mb-2">{{ restaurant }} 🍽️</h1>
        <p id="prompt-text" class="text-gray-600 mb-6 text-lg font-medium">{{ greeting }}</p>
        
        <button onclick="startListeningName()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-lg hover:bg-indigo-700 transition mb-4 flex items-center justify-center gap-2">
            🎤 Tap to Speak Your Name
        </button>
        
        <div class="flex gap-2">
            <input type="text" id="manual-name" placeholder="Or type your name" class="border rounded-xl px-4 py-2 w-full focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button onclick="submitName()" class="bg-green-600 text-white px-5 py-2 rounded-xl font-bold hover:bg-green-700 transition">Go</button>
        </div>
    </div>

    <script>
        let recognition = null;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-IN';

            recognition.onstart = function() {
                document.getElementById('prompt-text').innerText = "Listening for your name...";
            };

            recognition.onresult = async function(event) {
                let spokenText = event.results[0][0].transcript;
                document.getElementById('manual-name').value = spokenText;
                await sendNameToBackend(spokenText);
            };

            recognition.onerror = function() {
                document.getElementById('prompt-text').innerText = "Couldn't catch that. Please type your name or tap again.";
            };
        }

        function startListeningName() {
            if (!recognition) {
                alert("Speech recognition not supported in this browser. Please type your name.");
                return;
            }
            recognition.start();
        }

        async function submitName() {
            let nameInput = document.getElementById('manual-name').value.trim();
            if (!nameInput) {
                alert("Please enter your name!");
                return;
            }
            await sendNameToBackend(nameInput);
        }

        async function sendNameToBackend(name) {
            let res = await fetch('/api/greet-customer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name })
            });
            let data = await res.json();
            if (data.success) {
                window.location.href = `/menu?name=${encodeURIComponent(data.name)}`;
            }
        }
    </script>
</body>
</html>
