<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ restaurant }} Kiosk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-6xl mx-auto p-6">
        <header class="bg-white shadow rounded-lg p-6 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">{{ restaurant }} 🍔</h1>
                <p id="welcome-msg" class="text-sm text-gray-500">Welcome, Walk-in Guest!</p>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="promptCustomerLookup()" class="bg-indigo-100 text-indigo-700 px-3 py-2 rounded-lg font-semibold text-sm hover:bg-indigo-200 transition">
                    📱 Identify via Phone
                </button>
                <button onclick="toggleVoiceOrder()" id="mic-btn" class="bg-red-500 text-white px-4 py-2 rounded-full font-bold flex items-center gap-2 hover:bg-red-600 transition">
                    🎤 <span id="mic-text">Tap to Speak</span>
                </button>
            </div>
        </header>

        <!-- Voice feedback banner -->
        <div id="voice-banner" class="hidden bg-indigo-50 border border-indigo-200 text-indigo-700 px-4 py-3 rounded-lg mb-6 text-sm font-medium">
            Listening... Try saying: <span class="italic">"I want a paneer burger"</span> or <span class="italic">"Masala dosa please"</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Menu Grid -->
            <div class="md:col-span-2 grid grid-cols-2 gap-4">
                {% for item in menu %}
                <div class="bg-white p-4 rounded-lg shadow flex flex-col justify-between">
                    <div>
                        <span class="text-xs font-semibold text-indigo-600 uppercase">{{ item.category }}</span>
                        <h3 class="text-lg font-bold text-gray-800">{{ item.name }}</h3>
                        <p class="text-gray-600 font-medium">₹{{ item.price }}</p>
                    </div>
                    <button onclick="addToCart('{{ item.id }}', '{{ item.name }}', {{ item.price }})" 
                            class="mt-4 bg-indigo-600 text-white py-2 rounded font-medium hover:bg-indigo-700 transition">
                        Add to Cart
                    </button>
                </div>
                {% endfor %}
            </div>

            <!-- Cart Sidebar -->
            <div class="bg-white p-6 rounded-lg shadow flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Your Order</h2>
                    <div id="cart-items" class="space-y-3 mb-4 max-h-96 overflow-y-auto">
                        <p class="text-gray-400 text-sm">Cart is empty. Tap items or use voice.</p>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between font-bold text-lg mb-4 border-t pt-2">
                        <span>Total:</span>
                        <span id="cart-total">₹0</span>
                    </div>
                    <button onclick="checkout()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">
                        Confirm & Print Receipt
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        let currentCustomer = { phone: null, name: "Guest" };
        let recognition = null;

        // Initialize Speech Recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-IN';

            recognition.onstart = function() {
                document.getElementById('voice-banner').classList.remove('hidden');
                document.getElementById('mic-btn').classList.replace('bg-red-500', 'bg-yellow-500');
                document.getElementById('mic-text').innerText = "Listening...";
            };

            recognition.onresult = async function(event) {
                let spokenText = event.results[0][0].transcript;
                document.getElementById('voice-banner').innerText = `You said: "${spokenText}"`;
                
                let response = await fetch('/api/voice-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: spokenText })
                });
                let data = await response.json();
                
                if (data.success) {
                    addToCart(data.item.id, data.item.name, data.item.price);
                    document.getElementById('voice-banner').innerText = `Added ${data.item.name} to cart!`;
                } else {
                    document.getElementById('voice-banner').innerText = `Couldn't match "${spokenText}". Try again!`;
                }
            };

            recognition.onerror = function(event) {
                document.getElementById('voice-banner').innerText = "Voice recognition error. Please try again.";
                resetMicButton();
            };

            recognition.onend = function() {
                resetMicButton();
            };
        }

        function toggleVoiceOrder() {
            if (!recognition) {
                alert("Speech recognition is not supported in this browser. Use Chrome or Safari.");
                return;
            }
            recognition.start();
        }

        function resetMicButton() {
            document.getElementById('mic-btn').classList.replace('bg-yellow-500', 'bg-red-500');
            document.getElementById('mic-text').innerText = "Tap to Speak";
        }

        function promptCustomerLookup() {
            let phone = prompt("Enter your phone number for loyalty rewards & past orders:");
            if (!phone) return;

            fetch('/api/customer/lookup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone })
            })
            .then(res => res.json())
            .then(data => {
                if (data.found) {
                    currentCustomer = { phone: phone, name: data.name };
                    document.getElementById('welcome-msg').innerText = `Welcome back, ${data.name}! (Visits: ${data.visit_count})`;
                    alert(`Welcome back ${data.name}! Last time you ordered: ${data.last_order}`);
                } else {
                    let name = prompt("New customer! What is your name?");
                    if (name) {
                        currentCustomer = { phone: phone, name: name };
                        document.getElementById('welcome-msg').innerText = `Welcome, ${name}!`;
                    }
                }
            });
        }

        function addToCart(id, name, price) {
            let existing = cart.find(item => item.id === id);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ id, name, price, quantity: 1 });
            }
            renderCart();
        }

        function renderCart() {
            let container = document.getElementById("cart-items");
            let totalEl = document.getElementById("cart-total");
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-sm">Cart is empty. Tap items or use voice.</p>';
                totalEl.innerText = "₹0";
                return;
            }
            
            container.innerHTML = "";
            let total = 0;
            cart.forEach(item => {
                total += item.price * item.quantity;
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                        <div>
                            <p class="font-semibold text-sm">${item.name}</p>
                            <p class="text-xs text-gray-500">₹${item.price} × ${item.quantity}</p>
                        </div>
                        <button onclick="removeItem('${item.id}')" class="text-red-500 font-bold text-sm">✕</button>
                    </div>
                `;
            });
            totalEl.innerText = "₹" + total;
        }

        function removeItem(id) {
            cart = cart.filter(item => item.id !== id);
            renderCart();
        }

        async function checkout() {
            if (cart.length === 0) {
                alert("Cart is empty!");
                return;
            }
            
            let orderSummary = cart.map(i => `${i.quantity}x ${i.name}`).join(", ");
            
            if (currentCustomer.phone) {
                await fetch('/api/customer/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: currentCustomer.phone, name: currentCustomer.name, summary: orderSummary })
                });
            }

            let response = await fetch('/api/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items: cart })
            });
            let data = await response.json();
            if (data.success) {
                alert("Order confirmed! Total: ₹" + data.total);
                window.open('/api/download-receipt', '_blank');
                cart = [];
                currentCustomer = { phone: null, name: "Guest" };
                document.getElementById('welcome-msg').innerText = "Welcome, Walk-in Guest!";
                renderCart();
            }
        }
    </script>
</body>
</html>
